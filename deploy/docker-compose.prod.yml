# Production deployment behind the shared edge (see ../../theproxy).
#
# The contract that repository draws: join the external `edge` network, declare
# the hostname with labels, publish no ports. Caddy reads the labels off the
# running container and obtains the certificate itself.
#
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
#
# Only the frontend joins `edge`. Its nginx already reverse-proxies every API
# path to the backend, so one hostname serves the whole application and the
# backend stays on a private network with no route in from the internet.

name: factly

services:
  backend:
    build: ../apps/backend
    restart: unless-stopped
    # Secrets live on the server, never in git. See deploy/README.md.
    env_file: .env
    environment:
      PORT: 3002
      # Set here rather than in .env so the public identity of the deployment
      # cannot drift: OAuth redirects must match what GitHub and Google have
      # registered, and a stale localhost in .env would fail only at sign-in.
      OAUTH_CALLBACK_BASE_URL: https://factly.betafactory.co
      OAUTH_FRONTEND_URL: https://factly.betafactory.co/
    volumes:
      - backend-data:/app/data
    expose:
      - "3002"
    networks:
      - internal

  frontend:
    build: ../apps/frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:3002
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - edge
      - internal
    labels:
      caddy: factly.betafactory.co
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.header.Strict-Transport-Security: "max-age=31536000"

networks:
  edge:
    external: true
  # Backend reachable from the frontend only.
  internal:

volumes:
  backend-data:
